name: CD - Simulated Deployment

on:
  push:
    branches: [ feature/day5-delivery ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build, run and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t library-management:${{ github.sha }} .

      - name: Start application
        id: start
        run: docker run -d --name library-management-test -p 8000:8000 library-management:${{ github.sha }}

      - name: Verify deployment
        run: bash scripts/verify.sh http://127.0.0.1:8000/health

      - name: Show application logs on failure
        if: failure() && steps.start.outcome == 'success'
        run: docker logs library-management-test

      - name: Stop application
        if: always()
        run: |
          if docker container inspect library-management-test >/dev/null 2>&1; then
            docker rm --force library-management-test
          fi
